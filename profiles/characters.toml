# Curated per-character stat profiles. Edited by hand with Ben; the code only reads this file.
#
# Two kinds of profile (`kind`), at most one of each per character; scoring prefers "in-game":
#   in-game  The game's own Best in Slot + Favoured Minor Affixes screen. The game says it is
#            "sourced from recently active players" (usage statistics, not a design decision), so it
#            drifts with the community: every entry records when it was read and at which game
#            version. `usage_percent` is the share of players using that set, as the game shows it.
#            The four favoured substats are stored as ONE tier (ties); the order they appear in is
#            kept, but nobody has established that the order means anything.
#   guide    Third-party guide opinion (see the second half of this file).
#
# confidence: "provisional" until Ben has checked and approved an entry, then "curated".
# ("verified" is never set here.)
#
# Stat ids are the canonical FIGHT_PROP_* names:
#   CRIT Rate FIGHT_PROP_CRITICAL, CRIT DMG FIGHT_PROP_CRITICAL_HURT, ATK% FIGHT_PROP_ATTACK_PERCENT,
#   flat ATK FIGHT_PROP_ATTACK, HP% FIGHT_PROP_HP_PERCENT, flat HP FIGHT_PROP_HP,
#   DEF% FIGHT_PROP_DEFENSE_PERCENT, flat DEF FIGHT_PROP_DEFENSE, Energy Recharge
#   FIGHT_PROP_CHARGE_EFFICIENCY, Elemental Mastery FIGHT_PROP_ELEMENT_MASTERY.
#
# The in-game table gives sets, favoured substats and favoured main stats for sands, goblet and
# circlet (flower and plume are always flat HP / flat ATK, so they are not listed). Main stats are
# in the order the game lists them (highest use first) with `usage_percent`; a bare stat id means
# the game showed no percentage.
#
# Recommended weapons are NOT in the game. They come from public third-party guide pages
# (Game8, GameWith, GenshinBuilds, genshin.gg, Keqing Mains, Pocket Tactics), read on 2026-11-08
# and each independently re-checked against the live page. Every weapon lists its sources with
# the page's own stated freshness (`as_of`: a date, a game version, "(stale)" or "undated") and
# rank on that page. `best` = at least two CURRENT pages (dated since 2026-06-01 or stating 7.x)
# list it with rank 3 or better on one; `alternative` = weaker agreement. Stale and undated pages
# are kept as visible references but do not count towards `best`. Weapon names are checked
# against the data snapshot, which is also where a weapon's stats come from.

