# Guide-site profiles (10 characters), transcribed 2026-11-08 from a spreadsheet a friend sent Ben
# (Genshin_Artifact_Stat_Priorities.xlsx, sha256 in .claude/handoff-2026-11-08.md). The sheet
# summarises third-party guides (links are citations, never fetched). Everything here is
# `provisional`: it is NOT the in-game recommendation and not verified by Ben.
#
# Format: `substat_tiers` is the source's ranking, best first; a tier holds ties. A bare stat id
# is unconditional; an inline table adds a condition that the scorer must honour. Main stats
# list acceptable choices as the source gave them (not a ranking). Flower and plume are fixed
# (flat HP / flat ATK) so are not listed. No numeric weights are stored: tiers are converted to
# weights by the scoring engine under one documented rule.

[[profile]]
character_id = "10000136"
name = "Mitya"
role = "Off-field Stellar-Conduct sub-DPS"
observed_at = "2026-11-08"
game_version = "7.2"
source = "Third-party guide summary from a spreadsheet a friend sent Ben, checked 8 Nov 2026 at game 7.2; not the in-game recommendation; unverified"
confidence = "provisional"
kind = "guide"
substat_tiers = [
    ["FIGHT_PROP_ELEMENT_MASTERY"],
    ["FIGHT_PROP_CRITICAL_HURT"],
    ["FIGHT_PROP_CRITICAL"],
    ["FIGHT_PROP_CHARGE_EFFICIENCY"],
]
notes = [
    "CRIT DMG about 2x CRIT Rate. ER only matters when he is the only Electro in the team.",
