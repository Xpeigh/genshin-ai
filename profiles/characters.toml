# Curated per-character stat profiles. Edited by hand with Ben; the code only reads this file.
#
# Two kinds of profile (`kind`), at most one of each per character; scoring prefers "in-game":
#   in-game  The game's own Best in Slot + Favoured Minor Affixes screen. The game says it is
#            "sourced from recently active players" (usage statistics, not a design decision), so it
#            drifts with the community: every entry records when it was read and at which game
#            version. `usage_percent` is the share of players using that set, as the game shows it.
#            The four favoured substats are stored as ONE tier (ties). Ben confirmed 2026-11-08 that
#            their order in the game carries no meaning; the listed order is kept but not used.
#   guide    Third-party guide opinion (see the second half of this file).
#
# confidence: "provisional" until Ben has checked and approved an entry, then "curated".
# ("verified" is never set here.)
#
# Stat ids are the canonical FIGHT_PROP_* names:
#   CRIT Rate FIGHT_PROP_CRITICAL, CRIT DMG FIGHT_PROP_CRITICAL_HURT, ATK% FIGHT_PROP_ATTACK_PERCENT,
#   flat ATK FIGHT_PROP_ATTACK, HP% FIGHT_PROP_HP_PERCENT, flat HP FIGHT_PROP_HP,
#   DEF% FIGHT_PROP_DEFENSE_PERCENT, flat DEF FIGHT_PROP_DEFENSE, Energy Recharge
#   FIGHT_PROP_CHARGE_EFFICIENCY, Elemental Mastery FIGHT_PROP_ELEMENT_MASTERY.
#
# The in-game table gives sets and favoured substats only. Recommended main stats and weapons
# are not recorded yet.

