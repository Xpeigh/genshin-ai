# Guide profiles, second batch: every other playable character (87), researched 2026-11-08 from
# public guide pages by Claude's web tools (not the app). Two research rounds, every claim re-checked
# against the live page by a second agent; pages whose list belonged to another character or build were
# dropped. Rules used to merge the pages (deterministic, nothing invented):
#   - only CURRENT pages (stated update date since 2026-06-01, or game version 7.x) count towards
#     consensus; stale or undated pages are kept as visible references (`as_of`) only
#   - sets: `best` = named best by at least two current pages, otherwise `alternative`; if the sources
#     disagree on the best set the profile says so in its notes instead of picking one
#   - main stats: unconditional when every current page lists it, otherwise conditional ("only some of
#     the sources recommend it"); substats: ordered by their mean rank across the current pages
#   - a substat keeps a `condition` (so it is NOT scored) only for a real condition such as "only with
#     Favonius Lance"; targets and remarks (for example "ER about 130%") are notes
#   - weapons: `best` = two current pages and rank 3 or better on one; the weapon type of every
#     recommendation was checked against the character's
# The 8 characters the friend's sheet already covered (above) keep that profile and gained the weapons.
# Condition and note wording is the researcher's short paraphrase of the page, not a quotation.

