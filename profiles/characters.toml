# Curated per-character stat profiles. Edited by hand with Ben; the code only reads this file.
#
# source: the game's own in-game recommendation, which the game says is "sourced from recently
# active players" (usage statistics, not a design decision). It drifts with the community, so every
# entry records when it was read and at which game version.
#
# confidence: "provisional" until Ben has tuned and approved the weights, then "curated".
# ("verified" is never set here.) Weights: 1.0 = the game highlights this substat. Starting
# weights are a mechanical copy of the highlight; tune them with Ben, do not guess.
#
# Stat ids are the canonical FIGHT_PROP_* names:
#   CRIT Rate FIGHT_PROP_CRITICAL, CRIT DMG FIGHT_PROP_CRITICAL_HURT, ATK% FIGHT_PROP_ATTACK_PERCENT,
#   flat ATK FIGHT_PROP_ATTACK, HP% FIGHT_PROP_HP_PERCENT, flat HP FIGHT_PROP_HP,
#   DEF% FIGHT_PROP_DEFENSE_PERCENT, flat DEF FIGHT_PROP_DEFENSE, Energy Recharge
#   FIGHT_PROP_CHARGE_EFFICIENCY, Elemental Mastery FIGHT_PROP_ELEMENT_MASTERY.

[[profile]]
character_id = "10000143"
name = "Vesna"
observed_at = "2026-11-08"
game_version = "7.2"
source = "In-game recommended substats (highlighted), sourced by the game from recently active players; read by Ben"
confidence = "provisional"
# recommended_sets and recommended_main_stats not recorded yet: the game shows them, Ben to supply.

[profile.substat_weights]
FIGHT_PROP_CRITICAL_HURT = 1.0
FIGHT_PROP_ATTACK_PERCENT = 1.0
FIGHT_PROP_ELEMENT_MASTERY = 1.0
FIGHT_PROP_CRITICAL = 1.0

# Guide-site profiles (10 characters), transcribed 2026-11-08 from a spreadsheet a friend sent Ben
# (Genshin_Artifact_Stat_Priorities.xlsx, sha256 in .claude/handoff-2026-11-08.md). The sheet
# summarises third-party guides (links are citations, never fetched). Everything here is
# `provisional`: it is NOT the in-game recommendation and not verified by Ben.
#
# Format: `substat_tiers` is the source's ranking, best first; a tier holds ties. A bare stat id
# is unconditional; an inline table adds a condition that the scorer must honour. Main stats
# list acceptable choices as the source gave them (not a ranking). Flower and plume are fixed
# (flat HP / flat ATK) so are not listed. No numeric weights are stored: tiers are converted to
# weights by the scoring engine under one documented rule.

